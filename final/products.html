<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="author" content="Emmanuel Onukwue">
  <meta name="description" content="Browse the full mStore product catalogue. Search, filter by category, and sort by price or rating.">

  <meta property="og:title" content="Products | mStore">
  <meta property="og:description" content="Browse the full mStore product catalogue with live search, filters, and sorting.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/hero.webp">
  <meta property="og:url" content="https://emmaonukwue.github.io/wdd231/final/products.html">

  <title>Products | mStore</title>

  <link rel="icon" type="image/webp" href="images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/final.css">
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="mStore home">
        <img src="images/logo.webp" alt="mStore" width="150" height="36">
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-nav"
        aria-label="Toggle navigation menu">
        <span class="icon-open" aria-hidden="true">☰</span>
        <span class="icon-close" aria-hidden="true">✕</span>
      </button>

      <nav class="primary-nav" id="primary-nav" aria-label="Primary" aria-hidden="true">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html" aria-current="page">Products</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">

    <h1 class="section-title">All Products</h1>
    <p>Browse our full catalogue. Use the filters below to narrow your search.</p>

    <section class="filters" aria-label="Product filters">
      <div class="filters-row">
        <div class="field">
          <label for="search">Search</label>
          <input type="search" id="search" name="search" placeholder="Search products…" autocomplete="off">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="all">All categories</option>
          </select>
        </div>

        <div class="field">
          <label for="sort">Sort by</label>
          <select id="sort" name="sort">
            <option value="default">Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
      </div>
    </section>

    <p id="status" class="status" hidden></p>

    <section aria-label="Product list">
      <div id="product-grid" class="product-grid"></div>
    </section>

  </main>

  <!-- Accessible product modal -->
  <dialog id="product-modal" class="product-modal" aria-labelledby="modal-title">
    <div class="modal-inner modal-body"></div>
  </dialog>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; <span data-year>2026</span> mStore — WDD 231 - Emmanuel Onukwue Final Project</p>
      <p>
        <a href="attributions.html">Attributions</a> ·
        <a href="site-plan.html">Site Plan</a> ·
        <a href="https://www.youtube.com/" target="_blank" rel="noopener">Project Video</a>
      </p>
      <p><span id="fav-count">0 saved items</span></p>
    </div>
  </footer>

  <script type="module" src="scripts/main.js"></script>
  <script type="module" src="scripts/products.js"></script>

</body>
</html>
